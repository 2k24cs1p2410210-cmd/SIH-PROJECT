[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "transit-pulse-ml"
version = "0.1.0"
description = "Machine Learning & Data Engineering pipeline for TransitPulse AI ETA modeling"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "scikit-learn>=1.4.0",
    "xgboost>=2.0.0",
    "joblib>=1.3.0",
    "pytz>=2024.1"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.0",
    "jupyterlab>=4.1.0",
    "matplotlib>=3.8.0"
]
