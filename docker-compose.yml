version: '3.8'

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: transitpulse-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-transitpulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-transitpulse_secret}
      POSTGRES_DB: ${POSTGRES_DB:-transitpulse_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-transitpulse} -d ${POSTGRES_DB:-transitpulse_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: transitpulse-redis
    restart: always
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./services/api
      dockerfile: Dockerfile
    container_name: transitpulse-api
    restart: always
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-transitpulse}:${POSTGRES_PASSWORD:-transitpulse_secret}@postgres:5432/${POSTGRES_DB:-transitpulse_db}
      - REDIS_URL=redis://redis:6379/0
      - ENVIRONMENT=development
      - JWT_SECRET=${JWT_SECRET:-super_secret_jwt_key_change_in_production_32chars}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  passenger-web:
    build:
      context: ./apps/passenger-web
      dockerfile: Dockerfile
    container_name: transitpulse-passenger-web
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_BASE_URL=http://localhost:8000
      - NEXT_PUBLIC_WS_BASE_URL=ws://localhost:8000
    depends_on:
      - api

  admin-web:
    build:
      context: ./apps/admin-web
      dockerfile: Dockerfile
    container_name: transitpulse-admin-web
    restart: always
    ports:
      - "3001:3001"
    environment:
      - NEXT_PUBLIC_API_BASE_URL=http://localhost:8000
      - NEXT_PUBLIC_WS_BASE_URL=ws://localhost:8000
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
